<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuseLink 群聊</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:800px;margin:0 auto;padding:20px;background:#f5f5f5}
#status{padding:10px;background:#fff;border-radius:8px;margin-bottom:10px}
.online{color:green}.offline{color:red}
#chat{height:400px;overflow-y:auto;background:#fff;border-radius:8px;padding:15px;margin-bottom:10px}
.msg{margin:8px 0;padding:8px 12px;background:#e8e8e8;border-radius:12px;max-width:80%}
.msg.me{background:#007aff;color:#fff;margin-left:auto}
#input-area{display:flex;gap:10px}
#input{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px}
button{padding:10px 20px;background:#007aff;color:#fff;border:none;border-radius:8px;cursor:pointer}
#task-form{background:#fff;padding:15px;border-radius:8px;margin-top:10px}
#task-form input,#task-form textarea{width:100%;padding:8px;margin:5px 0;border:1px solid #ddd;border-radius:4px;box-sizing:border-box}
</style>
</head>
<body>
<h2>MuseLink 群聊 <button onclick="doLogout()" style="float:right;padding:6px 12px;font-size:14px;">登出</button></h2>
<div id="status">连接中...</div>
<div id="nodes"></div>
<div id="chat"></div>
<div id="input-area">
<input id="input" placeholder="输入群聊消息..." onkeypress="if(event.key==='Enter')sendChat()">
<button onclick="sendChat()">发送</button>
</div>
<div id="task-form">
<h3>派任务</h3>
<select id="target">
<option value="">加载中...</option>
</select>
<input id="task-title" placeholder="任务标题">
<textarea id="task-body" placeholder="任务正文" rows="3"></textarea>
<button onclick="sendTask()">派发</button>
</div>
<div id="machine-mgmt" style="background:#fff;padding:15px;border-radius:8px;margin-top:10px">
<h3>机器管理</h3>
<div id="machine-list" style="margin-bottom:10px"></div>
<div style="display:flex;gap:10px">
<input id="new-machine-id" placeholder="机器ID (如 muse-4)" style="flex:1">
<input id="new-machine-name" placeholder="显示名" style="flex:1">
<button onclick="addMachine()" style="white-space:nowrap">添加</button>
</div>
</div>
<script>
async function doLogout(){
await fetch('/api/logout',{method:'POST'});
location.href='/login.html';
}
// 机器管理
async function loadMachines(){
try{
const r=await fetch('/api/machines');
const d=await r.json();
if(d.ok){
const sel=document.getElementById('target');
sel.innerHTML=d.machines.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
const list=document.getElementById('machine-list');
list.innerHTML=d.machines.map(m=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #eee"><span>${m.name} <small style="color:#999">(${m.id})</small></span><button onclick="removeMachine('${m.id}')" style="padding:4px 10px;font-size:12px;background:#ff3b30">删除</button></div>`).join('');
}
}catch(e){console.error('加载机器列表失败',e);}
}
async function addMachine(){
const id=document.getElementById('new-machine-id').value.trim();
const name=document.getElementById('new-machine-name').value.trim()||id;
if(!id){alert('请输入机器ID');return;}
const r=await fetch('/api/machines',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name})});
const d=await r.json();
if(d.ok){document.getElementById('new-machine-id').value='';document.getElementById('new-machine-name').value='';loadMachines();if(d.warning)alert(d.warning);}
else alert(d.error||'添加失败');
}
async function removeMachine(id){
if(!confirm(`确定删除机器 ${id}？`))return;
const r=await fetch('/api/machines?id='+encodeURIComponent(id),{method:'DELETE'});
const d=await r.json();
if(d.ok)loadMachines();
else alert(d.error||'删除失败');
}
// 页面加载时获取机器列表
loadMachines();
const BROKER='wss://d2a41221.ala.asia-southeast1.emqxsl.com:8084/mqtt';
const USER='mqtt_user';
const PASS='123456789Wl-';
const SITE='1a6fea9c';
const ROOT=`mlink/v1/${SITE}`;
const client=mqtt.connect(BROKER,{username:USER,password:PASS,clientId:'web-'+Math.random().toString(16).slice(8)});
const nodes={};
client.on('connect',()=>{
document.getElementById('status').innerHTML='<span class="online">● 已连接</span>';
client.subscribe(`${ROOT}/chat`,{qos:1});
client.subscribe(`${ROOT}/node/+/status`,{qos:1});
client.subscribe(`${ROOT}/node/web/in`,{qos:1});
});
client.on('message',(topic,payload)=>{
try{
const env=JSON.parse(payload.toString());
if(topic.endsWith('/chat'))addMsg(env.from,env.body);
else if(topic.includes('/status')){
const nid=topic.split('/')[4];
nodes[nid]=payload.toString();renderNodes();
}else if(env.type==='dm'||env.type==='task')addMsg(env.from,'['+env.type+'] '+(env.title||'')+' '+(env.body||'').slice(0,200));
}catch(e){}
});
function addMsg(from,text){
const d=document.createElement('div');d.className='msg';d.textContent=from+': '+text;
document.getElementById('chat').appendChild(d);
document.getElementById('chat').scrollTop=1e6;
}
function renderNodes(){
document.getElementById('nodes').innerHTML=Object.entries(nodes).map(([k,v])=>`<span class="${v==='online'?'online':'offline'}">● ${k}</span>`).join(' ');
}
function sendChat(){
const t=document.getElementById('input').value;if(!t)return;
const env={proto:'muselink/1',from:'web',ts:Date.now()/1000,mid:Math.random().toString(16).slice(2,18),type:'chat',body:t};
client.publish(`${ROOT}/chat`,JSON.stringify(env),{qos:1});
document.getElementById('input').value='';
}
function sendTask(){
const target=document.getElementById('target').value;
const title=document.getElementById('task-title').value;
const body=document.getElementById('task-body').value;
if(!title||!body){alert('填标题和正文');return;}
const env={proto:'muselink/1',from:'web',ts:Date.now()/1000,mid:Math.random().toString(16).slice(2,18),type:'task',title,body};
client.publish(`${ROOT}/node/${target}/in`,JSON.stringify(env),{qos:1});
addMsg('我',`→ ${target}: ${title}`);
document.getElementById('task-title').value='';document.getElementById('task-body').value='';
}
</script>
</body>
</html>
